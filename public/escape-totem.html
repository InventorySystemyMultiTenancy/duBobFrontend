<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sair do Totem</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #eaf9ff;
        color: #5b0638;
        font-family: Arial, sans-serif;
      }

      main {
        width: min(92vw, 420px);
        padding: 32px;
        text-align: center;
        background: white;
        border: 1px solid #beebfa;
        border-radius: 18px;
        box-shadow: 0 10px 28px rgba(91, 6, 56, 0.16);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 30px;
      }

      p {
        color: #725264;
        line-height: 1.5;
      }

      a,
      button {
        display: block;
        width: 100%;
        margin-top: 18px;
        border: 0;
        border-radius: 14px;
        background: #e4007f;
        color: white;
        padding: 16px 20px;
        font-size: 16px;
        font-weight: 800;
        text-decoration: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Modo Totem limpo</h1>
      <p>O modo Totem, login e dados de sessao foram removidos deste navegador.</p>
      <button type="button" onclick="goHome()">Ir para o site normal</button>
      <a href="/">Abrir inicio</a>
    </main>

    <script>
      function clearTotem() {
        try {
          localStorage.removeItem("pc_totem_mode");
          localStorage.removeItem("pc_token");
          localStorage.removeItem("pc_user");
          sessionStorage.clear();
        } catch (error) {
          console.warn(error);
        }
      }

      function goHome() {
        clearTotem();
        window.location.replace("/");
      }

      clearTotem();
    </script>
  </body>
</html>
